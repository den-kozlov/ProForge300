[gcode_macro D_RESUME_WIPE]
description: Wipe the nozzle after resuming on pause
variable_extruder_restore_tool: -1
gcode:
  {% set tool = extruder_restore_tool %}
  {% set svv = printer.save_variables.variables %}
  SAVE_GCODE_STATE NAME=STATE_RESUME_WIPE
  G90
  {% if tool >= 0 and tool < svv.active_tools %}
    {% if tool == 0 %}
      G0 Y{svv.zero_dock_y} F20000
    {% elif tool == 1 %}
      G0 Y{svv.one_dock_y} F20000
    {% elif tool == 2 %}
      G0 Y{svv.two_dock_y} F20000
    {% endif %}
    G0 X{svv.zero_dock_x + 54} F1000
    G91
    G0 F20000
    G0 X-4 Y-3
    G0 X-4 Y6
    G0 X-4 Y-6
    G0 X-4 Y6
    G0 X-4 Y-3
    G90
  {% else %}
    M118 Invalid tool index for RESUME_WIPE
  {% endif %}

  
  G92 E0
  G0 E10 F600     #Prime the nozzle
  G92 E0
  G0 E-0.5 F1500
  G92 E0
  _WIPE
  G0 X0 F20000
  RESTORE_GCODE_STATE NAME=STATE_RESUME_WIPE
