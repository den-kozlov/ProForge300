[include .dynamicmacros.cfg]
[include chopper_tune.cfg]
############################################################################
####################### ProForge 300 Printer Config ########################
############################################################################

#config file version v1.2.1
#release date: 03.05.2025

# When updating this config file it is recommended to sun through
# the Eddy probe calibration and Input Shaping.

[include mainsail.cfg]
[include macros.cfg]
[include eddy.cfg]
[include calibrate-offsets.cfg]
[include so3_0.cfg]
[include so3_1.cfg]
[include so3_2.cfg]
[include timelapse.cfg]
[include shell_command.cfg]
[include camera_control.cfg]
[dynamicmacros]
configs: macros_dynamic.cfg

[save_variables]
filename: ~/printer_data/config/variables.cfg
#   Required - provide a filename that would be used to save the
#   variables to disk e.g. ~/variables.cfg
[virtual_sdcard]
path: ~/printer_data/gcodes

[force_move]
enable_force_move: True

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_330035000F51323433323831-if00

[exclude_object]

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 60000
minimum_cruise_ratio: 0.65
square_corner_velocity: 5.0
max_z_velocity: 12
max_z_accel: 300

[gcode_arcs]
resolution: 0.1

[firmware_retraction]
retract_length: 1
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 40

# MOTOR-1
[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
rotation_distance: 40  # Adjust based on your lead screw or belt system
microsteps: 32
full_steps_per_rotation: 200  # Motor step angle: 1.8° = 200 steps per rotation
#gear_ratio: 1
#step_pulse_duration: 2  # Add if the driver requires a specific pulse width
endstop_pin: ^PC1
position_min: -100
position_endstop: 303
position_max: 303
homing_speed: 100  # mm/s; adjust for your mechanics
homing_retract_speed: 25  # mm/s
[tmc5160 stepper_x]
cs_pin: PD5
spi_speed: 2000000
spi_software_sclk_pin: PE14
spi_software_mosi_pin: PE13
spi_software_miso_pin: PE15
interpolate: True
run_current: 2.2  # Adjusted for 2.5A motor rating (approximately 85-90% for safety)
hold_current: 2.0  # Reduce for lower heat generation during idle
sense_resistor: 0.05
stealthchop_threshold: 0  # Disabled for better torque and stability on X-axis
# Driver Tuning
driver_TBL: 1
driver_TOFF: 7
driver_PWM_OFS: 30
driver_PWM_GRAD: 4
driver_HSTRT: 6
driver_HEND: 9
driver_TPFD: 0


# MOTOR-2
[stepper_y]
step_pin: PA15
dir_pin: PA8
enable_pin: !PD1
rotation_distance: 40  # Adjust based on your belt/pulley system
microsteps: 32
full_steps_per_rotation: 200  # Motor step angle: 1.8° = 200 steps per rotation
#gear_ratio: 1
#step_pulse_duration: 2  # Add if the driver requires a specific pulse width
endstop_pin: ^PC3
position_min: -3
position_endstop: 300
position_max: 300
homing_speed: 100  # mm/s; adjust if necessary for your mechanics
homing_retract_speed: 25  # mm/s
[tmc5160 stepper_y]
cs_pin: PD0
spi_speed: 2000000
spi_software_sclk_pin: PE14
spi_software_mosi_pin: PE13
spi_software_miso_pin: PE15
interpolate: True
run_current: 2.2  # Adjusted to ~85-90% of the motor's rated 2.5A for safe operation
hold_current: 2.0  # Reduced for less heat generation during idle
sense_resistor: 0.05
stealthchop_threshold: 0  # Disabled to keep torque consistent for the Y-axis
# Driver Tuning
driver_TBL: 1
driver_TOFF: 7
driver_PWM_OFS: 30
driver_PWM_GRAD: 4
driver_HSTRT: 6
driver_HEND: 9
driver_TPFD: 0

# MOTOR-3
[stepper_z]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 300
position_min: -3.5
[tmc2209 stepper_z]
uart_pin: PE1
run_current: 0.75
sense_resistor: 0.11
stealthchop_threshold: 999999
interpolate: True           # Enables interpolation for smoother movement
hold_current: 0.4           # Sets a lower current when idle to reduce heat

# MOTOR-4
[stepper_z1]
step_pin: PD15
dir_pin: !PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 8
[tmc2209 stepper_z1]
uart_pin: PC6
run_current: 0.75
sense_resistor: 0.11
stealthchop_threshold: 999999
interpolate: True           # Enables interpolation for smoother movement
hold_current: 0.4           # Sets a lower current when idle to reduce heat

# MOTOR-5
[stepper_z2]
step_pin: PD11
dir_pin: !PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 8
[tmc2209 stepper_z2]
uart_pin: PD12
run_current: 0.75
sense_resistor: 0.11
stealthchop_threshold: 999999
interpolate: True           # Enables interpolation for smoother movement
hold_current: 0.4           # Sets a lower current when idle to reduce heat


[heater_bed]
heater_pin: PB5
sensor_type: Generic 3950
sensor_pin: PA1
#control: pid
#pid_Kp: 64.083
#pid_Ki: 3.338
#pid_Kd: 307.600
min_temp: 0
max_temp: 115

[fan]
pin: PB7
max_power: 1.0
kick_start_time: 0.250

[fan_generic filter_fan]
pin: PB6
kick_start_time: 0.250


[z_tilt]
z_positions:
    -55, -16
    152.5, 356.54
    371, -16
points:
    1.2, 8.7
    121.2, 248.7
    241.2, 8.7
speed: 300
horizontal_move_z: 10
retries: 6
retry_tolerance: 0.1

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    {% if not printer.z_tilt.applied %}
    _Z_TILT_ADJUST horizontal_move_z=5 retry_tolerance=1
    {% endif %}
    _Z_TILT_ADJUST horizontal_move_z=2
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT
    
    
[servo toolchanger]
pin: PC15
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

[skew_correction]

[respond]
default_type: echo

[shaketune]
# result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
# number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
# keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
# show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
# timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
# measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
# max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
# dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

[input_shaper]
shaper_type_x = 2hump_ei
shaper_freq_x = 76.8
shaper_type_y = zv
shaper_freq_y = 66.2

